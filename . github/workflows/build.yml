name: Build PhpSpreadsheet

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '8.1', '8.2', '8.3' ]

    name: Build on PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, zip, gd, iconv, fileinfo
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Run tests (если есть)
        run: composer test || echo "Tests skipped or failed"

      - name: Prepare build artifact
        run: |
          mkdir -p build
          # Копируем собранный проект (без dev-зависимостей и кэша)
          rsync -a --exclude='.git' \
                   --exclude='tests' \
                   --exclude='.github' \
                   --exclude='build' \
                   ./ build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpspreadsheet-php${{ matrix.php-version }}
          path: build/
          retention-days: 14
          if-no-files-found: error
