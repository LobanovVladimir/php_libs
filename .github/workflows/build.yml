name: Build PhpSpreadsheet from scratch

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, zip, gd, iconv, fileinfo, ctype, dom, simplexml, xmlreader, xmlwriter, zlib
          tools: composer:v2
          coverage: none

      - name: Create composer.json and install PhpSpreadsheet
        run: |
          # Генерируем минимальный composer.json без интерактивных вопросов
          composer init \
            --name="build/phpspreadsheet-artifact" \
            --description="Standalone build of PhpSpreadsheet" \
            --require="phpoffice/phpspreadsheet" \
            --no-interaction

          # Устанавливаем зависимости (prod, без dev)
          composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Verify installation
        run: |
          # Проверяем, что библиотека реально установилась
          php -r "require 'vendor/autoload.php'; echo class_exists('PhpOffice\\PhpSpreadsheet\\Spreadsheet') ? 'OK' : 'FAIL';"

      - name: Prepare artifact (vendor + composer files)
        run: |
          mkdir -p build
          cp -r vendor build/vendor
          cp composer.json build/composer.json
          cp composer.lock build/composer.lock 2>/dev/null || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpspreadsheet-build
          path: build/
          retention-days: 14
          if-no-files-found: error
